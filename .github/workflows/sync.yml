name: Sync Plataforma -> Sheets

concurrency:
  group: plataforma-sheets-publication
  cancel-in-progress: false

on:
  schedule:
    - cron: '15 9 * * *'  # 09:15 UTC = 06:15 BRT (diario; snapshot do dia)
  workflow_dispatch: {}    # Permite rodar manualmente

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest

      - name: Validar contrato de analytics
        run: pytest -q test_analytics_contract.py test_sheets_retry.py test_sync_aprovai.py test_dashboard_painel.py test_sdr_automatize.py test_sync_incentivador.py test_painel_plataforma.py test_sync_primeira_fila.py test_sync_comunidade.py test_sync_visao_geral.py test_explorar_disparos.py

      - name: Sync Plataforma -> Sheets
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          AUTOMATIZE_ENDPOINT_TOKEN: ${{ secrets.AUTOMATIZE_ENDPOINT_TOKEN }}
          # Mesma conta dashboard-leitura da aba Comunidade: le o GA da Plataforma
          # (537748462, match.brada.social). Ausente = aba Plataforma Brada sai sem o
          # bloco de visitas, sem derrubar o resto do sync.
          COMUNIDADE_SA_JSON: ${{ secrets.COMUNIDADE_SA_JSON }}
          # Banco do SDR Brada (Automatize, so leitura): funil do SDR de aptos. Ausente =
          # a aba sai sem esse funil.
          AUTOMATIZE_SDR_DB_HOST: ${{ secrets.AUTOMATIZE_SDR_DB_HOST }}
          AUTOMATIZE_SDR_DB_PORT: ${{ secrets.AUTOMATIZE_SDR_DB_PORT }}
          AUTOMATIZE_SDR_DB_NAME: ${{ secrets.AUTOMATIZE_SDR_DB_NAME }}
          AUTOMATIZE_SDR_DB_USER: ${{ secrets.AUTOMATIZE_SDR_DB_USER }}
          AUTOMATIZE_SDR_DB_PASSWORD: ${{ secrets.AUTOMATIZE_SDR_DB_PASSWORD }}
        run: python sync.py

      # Mesma Sheet (aba AprovAI + raw_asaas_aprovai + raw_funil_aprovai), fonte
      # separada (Asaas + Firestore do projeto aprovai-de156, app do Thiago).
      # Passo independente: uma falha aqui nao derruba o sync.py principal (ja rodou).
      # Firestore: conta dashboard-leitura (COMUNIDADE_SA_JSON) desde 11/11 -
      # ganhou datastore.viewer em aprovai-de156, nao precisa mais da SA dedicada
      # aprovai-sa.json / APROVAI_FIREBASE_SERVICE_ACCOUNT_JSON.
      - name: Sync AprovAI -> Sheets
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          ASAAS_APROVAI_API_KEY: ${{ secrets.ASAAS_APROVAI_API_KEY }}
          ASAAS_APROVAI_ENVIRONMENT: production
          COMUNIDADE_SA_JSON: ${{ secrets.COMUNIDADE_SA_JSON }}
          # Funil do SDR de elaboracao (banco do SDR Brada). Ausente = aba sai sem ele.
          AUTOMATIZE_SDR_DB_HOST: ${{ secrets.AUTOMATIZE_SDR_DB_HOST }}
          AUTOMATIZE_SDR_DB_PORT: ${{ secrets.AUTOMATIZE_SDR_DB_PORT }}
          AUTOMATIZE_SDR_DB_NAME: ${{ secrets.AUTOMATIZE_SDR_DB_NAME }}
          AUTOMATIZE_SDR_DB_USER: ${{ secrets.AUTOMATIZE_SDR_DB_USER }}
          AUTOMATIZE_SDR_DB_PASSWORD: ${{ secrets.AUTOMATIZE_SDR_DB_PASSWORD }}
        run: python sync_aprovai.py

      # Aba Incentivador (junta as antigas SDR Incentivador e Disparo Incentivador):
      # banco do SDR Brada (so incentivador) + HubSpot ao vivo, do disparo a reuniao.
      - name: Sync Incentivador -> Sheets
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          AUTOMATIZE_SDR_DB_HOST: ${{ secrets.AUTOMATIZE_SDR_DB_HOST }}
          AUTOMATIZE_SDR_DB_PORT: ${{ secrets.AUTOMATIZE_SDR_DB_PORT }}
          AUTOMATIZE_SDR_DB_NAME: ${{ secrets.AUTOMATIZE_SDR_DB_NAME }}
          AUTOMATIZE_SDR_DB_USER: ${{ secrets.AUTOMATIZE_SDR_DB_USER }}
          AUTOMATIZE_SDR_DB_PASSWORD: ${{ secrets.AUTOMATIZE_SDR_DB_PASSWORD }}
        run: |
          if [ -z "$AUTOMATIZE_SDR_DB_HOST" ]; then
            echo "::warning::AUTOMATIZE_SDR_DB_HOST ausente: aba Incentivador nao atualizada."
            exit 0
          fi
          python sync_incentivador.py

      # Aba Primeira Fila: banco da Automatize, usuario so leitura (esquema dados).
      - name: Sync Primeira Fila -> Sheets
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          PF_DB_HOST: ${{ secrets.PF_DB_HOST }}
          PF_DB_USER: ${{ secrets.PF_DB_USER }}
          PF_DB_PASSWORD: ${{ secrets.PF_DB_PASSWORD }}
        run: python sync_primeira_fila.py

      # Aba Comunidade: Firestore + Auth de brada-comunidade-c1ba5, conta dashboard-leitura (so leitura).
      - name: Sync Comunidade -> Sheets
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          COMUNIDADE_SA_JSON: ${{ secrets.COMUNIDADE_SA_JSON }}
        run: |
          if [ -z "$COMUNIDADE_SA_JSON" ]; then
            echo "::warning::COMUNIDADE_SA_JSON ausente: aba Comunidade nao atualizada (falta permissao do dono do projeto)."
            exit 0
          fi
          python sync_comunidade.py

      # Aba Brenda (antes Explorar disparos): envios das 3 frentes agregados (sem PII) + filtros por formula.
      - name: Brenda (antes Explorar disparos) -> Sheets
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          AUTOMATIZE_SDR_DB_HOST: ${{ secrets.AUTOMATIZE_SDR_DB_HOST }}
          AUTOMATIZE_SDR_DB_PORT: ${{ secrets.AUTOMATIZE_SDR_DB_PORT }}
          AUTOMATIZE_SDR_DB_NAME: ${{ secrets.AUTOMATIZE_SDR_DB_NAME }}
          AUTOMATIZE_SDR_DB_USER: ${{ secrets.AUTOMATIZE_SDR_DB_USER }}
          AUTOMATIZE_SDR_DB_PASSWORD: ${{ secrets.AUTOMATIZE_SDR_DB_PASSWORD }}
        run: |
          if [ -z "$AUTOMATIZE_SDR_DB_HOST" ]; then
            echo "::warning::AUTOMATIZE_SDR_DB_HOST ausente: aba Explorar disparos nao atualizada."
            exit 0
          fi
          python explorar_disparos.py

      # Aba Visao Geral: le o resumo que os passos acima gravaram (dados_resumo) e a divisao
      # dos disparos no banco do SDR (sem o banco, sai sem esse bloco). Sempre por ultimo.
      - name: Visao Geral -> Sheets
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          AUTOMATIZE_SDR_DB_HOST: ${{ secrets.AUTOMATIZE_SDR_DB_HOST }}
          AUTOMATIZE_SDR_DB_PORT: ${{ secrets.AUTOMATIZE_SDR_DB_PORT }}
          AUTOMATIZE_SDR_DB_NAME: ${{ secrets.AUTOMATIZE_SDR_DB_NAME }}
          AUTOMATIZE_SDR_DB_USER: ${{ secrets.AUTOMATIZE_SDR_DB_USER }}
          AUTOMATIZE_SDR_DB_PASSWORD: ${{ secrets.AUTOMATIZE_SDR_DB_PASSWORD }}
        run: python sync_visao_geral.py
